<html layout:decorate="~{yjshop/user/layout}">
<div layout:fragment="content">
  <style>
    .product-box {
      max-width: 900px;
      margin: 40px auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      display: flex;
      gap: 40px;
      background-color: #fff;
    }

    .product-image {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .product-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .product-details h3 {
      font-size: 22px;
      margin-bottom: 10px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    .product-details .name {
      font-size: 20px;
      font-weight: bold;
    }

    .product-details .price {
      font-size: 18px;
      color: #2d2d2d;
    }

    .product-details select,
    .product-details input[type="number"] {
      padding: 8px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
    }

    .product-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .product-actions input[type="submit"],
    .product-actions button {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-cart {
      background-color: #f0c14b;
      color: #111;
      border: 1px solid #a88734;
    }

    .btn-buy {
      background-color: #ff9900;
      color: white;
      border: 1px solid #ff9900;
    }
  </style>

  <div class="product-box">
    <!-- 왼쪽: 이미지 -->
    <div class="product-image">
      <img th:src="${product.imageUrl}" alt="상품 이미지">
    </div>

    <!-- 오른쪽: 상세 정보 -->
    <div class="product-details">
      <h3>상품 정보</h3>
      <div class="name" th:text="${product.name}">상품명</div>
      <div class="price" th:text="'₩' + ${product.price}">가격</div>

      <form th:action="@{/view/my/wishlist}" method="post">
        <div>
          <label><strong>옵션 선택</strong></label>
          <select name="optionId" required>
            <option value="" disabled selected>옵션을 선택하세요</option>
            <option th:each="option : ${product.options}"
                    th:value="${option.id}"
                    th:text="${option.optionName} + ' (+' + ${option.price()} + ')'">
            </option>
          </select>
        </div>

        <div style="margin-top: 10px;">
          <label><strong>수량</strong></label>
          <input type="number" name="quantity" min="1" value="1" required>
        </div>

        <div class="product-actions">
          <input type="submit" value="장바구니 담기" class="btn-cart">
          <form th:action="@{/view/my/payment}" method="get" style="flex: 1;">
            <button type="submit" class="btn-buy">바로 구매하기</button>
          </form>
        </div>
      </form>
    </div>
  </div>
</div>
</html>
