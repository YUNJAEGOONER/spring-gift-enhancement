<html layout:decorate="~{yjshop/user/layout}">
<div layout:fragment="content">

  <table>

    <style>
      td h2 {
        display: inline-block;
        margin: 0 6px;
        font-size: 18px;
        line-height: 1;
        vertical-align: middle;
        cursor: pointer;
      }

      td form {
        display: inline-block;
        margin-left: 6px;
      }

      td form button {
        height: 32px;
        padding: 0 10px;
        font-size: 14px;
        background-color: #90ee90;
        border: 1px solid #ccc;
        cursor: pointer;
        font-weight: bold;
      }

    </style>

    <thead>
    <tr>
      <th>상품명</th>
      <th>상품 옵션</th>
      <th>상품이미지</th>
      <th>수량</th>
      <th>가격</th>
      <th>장바구니 수정</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="responseDto: ${wishlist}">
      <td th:text="${responseDto.productName}"></td>
      <td th:text="${responseDto.optionName}"></td>
      <td><img th:src="@{${responseDto.productImage}}" width="100px" alt="상품 이미지"/></td>
      <td th:text="${responseDto.quantity}"></td>
      <td th:text="${responseDto.price}"></td>

      <td>
        <form
            th:action="@{/view/my/wishlist/add/{wishListId}(wishListId=${responseDto.wishListId})}"
            method="post">
          <button type="submit">+</button>
        </form>
        <form
            th:action="@{/view/my/wishlist/subtract/{wishListId}(wishListId=${responseDto.wishListId})}"
            method="post">
          <button type="submit">-</button>
        </form>
        <form th:action="@{/view/my/payment}" method="get">
          <button type="submit">바로 구매하기</button>
        </form>
        <form
            th:action="@{/view/my/wishlist/delete/{wishListId}(wishListId=${responseDto.wishListId})}"
            method="post">
          <button type="submit">비우기</button>
        </form>
      </td>

    </tr>
    </tbody>
  </table>

  <div th:if="${!wishlist.empty}">
    <ul class="pagination justify-content-center">

      <!-- 이전 버튼 -->
      <li class="page-item" th:classappend="${!wishlist.hasPrevious()} ? 'disabled'">
        <a class="page-link"
           th:if="${wishlist.hasPrevious()}"
           th:href="@{|?page=${wishlist.number - 1}|}">
          <span>이전</span>
        </a>
        <a class="page-link" th:unless="${wishlist.hasPrevious()}">
          <span>이전</span>
        </a>
      </li>

      <!-- 페이지 번호들 -->
      <li th:each="page : ${#numbers.sequence(0, wishlist.totalPages - 1)}"
          th:if="${page >= wishlist.number - 5 and page <= wishlist.number + 5}"
          th:classappend="${page == wishlist.number} ? ' active'"
          class="page-item">
        <a class="page-link"
           th:text="${page + 1}"
           th:href="@{|?page=${page}|}"></a>
      </li>

      <!-- 다음 버튼 -->
      <li class="page-item" th:classappend="${!wishlist.hasNext()} ? ' disabled'">
        <a class="page-link"
           th:if="${wishlist.hasNext()}"
           th:href="@{|?page=${wishlist.number + 1}|}">
          <span>다음</span>
        </a>
        <a class="page-link" th:unless="${wishlist.hasNext()}">
          <span>다음</span>
        </a>
      </li>

    </ul>
  </div>

  </body>
</div>
</html>
