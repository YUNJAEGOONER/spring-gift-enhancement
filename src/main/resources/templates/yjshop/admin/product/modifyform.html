<html layout:decorate="~{yjshop/admin/layout}">
<div layout:fragment="content">
  <div>
    <form th:action="@{/view/admin/products/modify/{id}(id=${product.id})}"
          th:object="${productRequestDto}"
          method="post"
          class="admin-form">

      <h3>상품 수정하기</h3>

      <div class="form-group">
        <label><strong>상품명</strong></label>
        <input type="text" name="name" placeholder="상품명 입력" th:value="${product.name}">
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
      </div>

      <div class="form-group">
        <label><strong>가격</strong></label>
        <input type="number" name="price" placeholder="상품 가격 입력" th:value="${product.price}">
        <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</div>
      </div>

      <div class="form-group">
        <label><strong>이미지 주소</strong></label>
        <input type="text" name="imageUrl" placeholder="상품 이미지 주소 입력" th:value="${product.imageUrl}">
        <div class="error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}">imageUrl Error</div>
      </div>

      <div class="form-buttons">
        <input type="submit" value="상품 수정하기">
      </div>
    </form>
  </div>

  <table>
    <th>옵션</th>
    <th>수량</th>
    <th>가격</th>
    <tr th:each="option: ${options}">
      <form th:action="@{/view/admin/options/edit/{id}(id=${option.id})}" method="post" class="admin-form">
        <div>
          <label><strong>옵션</strong></label>
          <input type="text" name="name" placeholder="상품명 입력" th:value="${option.optionName}">
        </div>

        <div>
          <label><strong>가격</strong></label>
          <input type="text" name="name" placeholder="상품명 입력" th:value="${option.price}">
        </div>

        <div>
          <label><strong>수량</strong></label>
          <input type="text" name="name" placeholder="상품명 입력" th:value="${option.quantity()}">
        </div>

        <input type="hidden" name="productId" th:value="${option.id}">
        <button type="submit">수정</button>

        <form th:action="@{/view/admin/options/remove/{id}(id=${option.id})}" method="post">
            <button type="submit">삭제</button>
        </form>

      </form>
    </tr>
  </table>

</div>
</html>
